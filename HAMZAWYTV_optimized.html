<style>
:root{--bg:#05060b;--panel:#0d0f17;--text:#f7f7fb;--muted:#a2a5b3;--red:#e50914;--line:#ffffff18;--rail:88px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:linear-gradient(145deg,#05060b,#090b18 55%,#05060b);color:var(--text);font-family:Poppins,system-ui,sans-serif;overflow-x:hidden}button,input{font:inherit}.hide{display:none!important}
button{color:inherit}.glass{background:#11131ddf;border:1px solid var(--line);box-shadow:0 14px 38px #0008}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:22px;z-index:1000;background:radial-gradient(circle at 50% 0,#5d071044,transparent 52%),var(--bg)}
.loginCard{width:min(460px,94vw);border-radius:28px;padding:28px}.brand{font-size:1.25rem;font-weight:800;letter-spacing:.7px;text-align:center;margin-bottom:20px}.mark{width:48px;height:48px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,var(--red),#ff5660);box-shadow:0 10px 28px #e5091455}
.field{width:100%;height:54px;margin:7px 0;border:1px solid var(--line);border-radius:17px;background:#ffffff0a;color:#fff;padding:0 16px;outline:0}.field:focus{border-color:#e5091499;box-shadow:0 0 0 4px #e5091422}.primary,.ghost{border:0;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--red),#ff3541)}.primary:disabled,.ghost:disabled{opacity:.5;cursor:wait}.ghost{background:#ffffff0b;border:1px solid var(--line)}.wide{width:100%;height:54px;margin-top:8px}.status{text-align:center;color:var(--muted);font-size:.82rem;line-height:1.5;margin-top:12px;min-height:20px}.status.ok{color:#4ade80}.status.err{color:#fb7185}.loginOptions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 2px 2px;color:var(--muted);font-size:.78rem}.remember{display:flex;align-items:center;gap:7px}.advanced{margin-top:10px;border:1px solid var(--line);border-radius:16px;background:#ffffff05}.advanced summary{cursor:pointer;padding:10px 13px;color:var(--muted);font-size:.78rem}.advancedBody{padding:0 10px 10px}.advanced .field{height:45px;font-size:.78rem}.hint{color:#777b8c;font-size:.7rem;line-height:1.45;margin:4px 4px 0}
#app{display:none}body.ready #login{display:none}body.ready #app{display:block}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:100;display:flex;flex-direction:column;gap:9px;align-items:center;padding:14px 10px;background:#090b12f5;border-right:1px solid var(--line)}.rail .mark{width:43px;height:43px;margin:0 0 8px}.nav{width:56px;height:50px;border-radius:17px;border:1px solid var(--line);background:#ffffff08;cursor:pointer;font-size:20px}.nav:hover,.nav.active,.nav:focus-visible{background:#e5091425;border-color:#e5091488;outline:0}.spacer{flex:1}
main{margin-left:var(--rail);min-height:100vh}.topbar{position:sticky;top:0;z-index:50;display:flex;gap:12px;padding:14px 3.5vw;background:#05060bea;border-bottom:1px solid var(--line)}.search{flex:1;height:50px;border-radius:16px;border:1px solid var(--line);background:#11131d;color:#fff;padding:0 16px;outline:0}.search:focus{border-color:#e5091477}.smallStatus{min-width:90px;align-self:center;text-align:right;color:var(--muted);font-size:.8rem}
.hero{position:relative;min-height:410px;display:flex;align-items:end;padding:44px 4vw 32px;overflow:hidden;background:#10121b}.hero::before{content:"";position:absolute;inset:0;background-image:var(--hero);background-size:cover;background-position:center;opacity:.45}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05060bf7 4%,#05060b88 55%,#05060bdd),linear-gradient(0deg,#05060b 0,transparent 70%)}.heroText{position:relative;z-index:1;max-width:740px}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:0 0 12px}.hero p{color:#ddd;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.page{padding:20px 4vw 70px}.pageHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}.pageHead h2{margin:0}.sub{color:var(--muted);font-size:.86rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.catGrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.card,.cat{content-visibility:auto;contain-intrinsic-size:300px;border:1px solid var(--line);background:#11131d;border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 12px 28px #0005;transition:transform .16s var(--ease),border-color .16s}.card:hover,.cat:hover,.card:focus-visible,.cat:focus-visible{transform:translateY(-4px);border-color:#e5091488;outline:0}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#171923}.info{padding:10px 11px 13px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.cat img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#171923}.cat .info{padding:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:24px}.empty{grid-column:1/-1;padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
#results{position:fixed;z-index:200;top:74px;left:calc(var(--rail) + 3.5vw);right:3.5vw;max-height:70vh;overflow:auto;border-radius:20px;background:#10121bf7;border:1px solid var(--line);box-shadow:0 20px 55px #000b}.result{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#ffffff0b}.result img{width:46px;height:65px;object-fit:cover;border-radius:10px}.resultText{min-width:0}
#drawer{position:fixed;z-index:300;inset:8vh 2vw 2vh calc(var(--rail) + 2vw);border-radius:24px;background:#0c0e16f8;border:1px solid var(--line);box-shadow:0 25px 80px #000c;overflow:auto}.drawerHead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px;background:#0c0e16;border-bottom:1px solid var(--line)}.seasons{padding:14px}.season{margin-bottom:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden}.season summary{padding:13px;font-weight:800;cursor:pointer;background:#ffffff08}.episode{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.toast{position:fixed;right:18px;bottom:18px;z-index:500;padding:12px 16px;border-radius:14px;background:#171923;border:1px solid var(--line);box-shadow:0 14px 35px #000a}
img{color:transparent}@media(max-width:720px){:root{--rail:68px}.rail{padding-inline:6px}.nav{width:50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.catGrid{grid-template-columns:1fr}.page{padding-inline:3vw}.episode{grid-template-columns:1fr}.hero{min-height:350px}.smallStatus{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<section id="login"><form id="loginForm" class="loginCard glass"><div class="mark"></div><div class="brand">HAMZAWYTV</div><input id="username" class="field" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" required><input id="password" class="field" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Password" required><div class="loginOptions"><label class="remember"><input id="remember" type="checkbox" checked> Remember login</label><span>Press Enter to connect</span></div><details class="advanced"><summary>Server settings</summary><div class="advancedBody"><input id="host" class="field" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="Server URL"><input id="proxy" class="field" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="Proxy URL: /api or leave blank"><div class="hint">If the page is HTTPS and the server starts with HTTP, an API proxy is required.</div></div></details><button id="connectBtn" class="primary wide" type="submit">Connect</button><div id="loginStatus" class="status">Enter your login information</div></form></section>
<div id="app">
 <aside class="rail"><div class="mark"></div><button class="nav" data-kind="live" title="TV">▣</button><button class="nav" data-kind="vod" title="Movies">▶</button><button class="nav" data-kind="series" title="Series">☷</button><button class="nav" data-kind="sport" title="Sports">★</button><button class="nav" data-kind="continue" title="Continue">↻</button><div class="spacer"></div><button id="logout" class="nav" title="Logout">⇥</button></aside>
 <main><header class="topbar"><input id="search" class="search" placeholder="Search loaded titles…" autocomplete="off"><div id="smallStatus" class="smallStatus">Ready</div></header>
 <section id="hero" class="hero"><div class="heroText"><h1 id="heroTitle">Welcome</h1><p id="heroDesc">Choose TV, Movies, Series, or Sports.</p><div class="actions"><button id="play" class="primary" disabled>Play / Open</button><button id="copy" class="ghost" disabled>Copy link</button><button id="download" class="ghost" disabled>Download</button><button id="favorite" class="ghost hide">★ Favorite</button></div></div></section>
 <section class="page"><div class="pageHead"><div><h2 id="pageTitle">Categories</h2><div id="pageSub" class="sub">Choose a section</div></div><div class="toolbar"><button id="back" class="ghost hide">Back</button></div></div><div id="grid" class="grid catGrid"></div><div id="pager" class="pager hide"><button id="prev" class="ghost">Previous</button><span id="pageNumber"></span><button id="next" class="ghost">Next</button></div></section>
 </main>
</div>
<div id="results" class="hide"></div>
<section id="drawer" class="hide"><div class="drawerHead"><strong id="drawerTitle">Series</strong><button id="closeDrawer" class="ghost">Close</button></div><div id="seasons" class="seasons"></div></section>
<div id="toast" class="toast hide"></div>
<script>
"use strict";
const CONFIG={host:"http://line.trxdnscloud.ru",apiProxy:"/api",downloadProxy:"/download",categoryImages:"https://raw.githubusercontent.com/a860h040/TV/main",pageSize:48,searchLimit:12,timeout:10000};
const $=id=>document.getElementById(id), PH="https://placehold.co/300x450/171923/ffffff?text=No+Image";
const state={user:"",pass:"",kind:"",heroKind:"",categories:[],category:null,items:[],page:1,hero:null,cache:new Map(),seriesCache:new Map(),inflight:new Map(),loginBusy:false,viewToken:0};
const authKey="hamzawytv_auth_v7",settingsKey="hamzawytv_settings_v7",cwKey="hamzawytv_cw_v6",favKey="hamzawytv_fav_v6";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=s=>String(s||"video").replace(/[^\w\s().&-]/g,"").trim();
const poster=(k,x)=>x?(k==="series"?(x.cover||x.stream_icon):(x.stream_icon||x.cover))||PH:PH;
const label=k=>({live:"TV",vod:"Movies",series:"Series",sport:"Sports"}[k]||"Browse");
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.add("hide"),1800)}
function status(msg,err=false){$("smallStatus").textContent=msg;$("loginStatus").textContent=msg;$("loginStatus").className="status "+(err?"err":"ok")}
function copyText(text){return navigator.clipboard?.writeText(text).then(()=>true).catch(()=>false)||Promise.resolve(false)}
function normalizeBase(value){return String(value||"").trim().replace(/\/+$/,"")}
function setProxyEndpoint(value){const p=String(value||"").trim();CONFIG.apiProxy=p;CONFIG.downloadProxy=/\/api\/?$/i.test(p)?p.replace(/\/api\/?$/i,"/download"):"/download"}
function proxyUrl(base,target){
 const p=String(base||"").trim();if(!p)return "";
 if(p.includes("{url}"))return p.replace("{url}",encodeURIComponent(target));
 return `${p}${p.includes("?")?"&":"?"}url=${encodeURIComponent(target)}`
}
function requestCandidates(target){
 const list=[];const custom=proxyUrl(CONFIG.apiProxy,target);if(custom)list.push({url:custom,name:"configured proxy"});
 const pageHttps=location.protocol==="https:",targetHttp=/^http:\/\//i.test(target);
 if(!(pageHttps&&targetHttp))list.push({url:target,name:"direct connection"});
 return list.filter((x,i,a)=>a.findIndex(y=>y.url===x.url)===i)
}
function parseJsonText(text){
 const clean=String(text||"").replace(/^\uFEFF/,"").trim();
 try{return JSON.parse(clean)}catch{}
 const starts=[clean.indexOf("{"),clean.indexOf("[")].filter(n=>n>=0).sort((a,b)=>a-b);
 for(const i of starts){try{return JSON.parse(clean.slice(i))}catch{}}
 throw new Error("Server returned invalid JSON")
}
async function fetchAttempt(url){
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),CONFIG.timeout);
 try{const r=await fetch(url,{signal:ctrl.signal,cache:"no-store",credentials:"omit",redirect:"follow"});const text=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status}`);return parseJsonText(text)}finally{clearTimeout(timer)}
}
async function json(target,{dedupe=true}={}){
 if(dedupe&&state.inflight.has(target))return state.inflight.get(target);
 const job=(async()=>{let last=null;const errors=[];for(const c of requestCandidates(target)){try{return await fetchAttempt(c.url)}catch(e){last=e;errors.push(`${c.name}: ${e.name==="AbortError"?"timeout":e.message}`)}}const err=new Error(errors.join(" • ")||last?.message||"Connection failed");err.cause=last;throw err})();
 if(dedupe)state.inflight.set(target,job);
 try{return await job}finally{if(state.inflight.get(target)===job)state.inflight.delete(target)}
}
function endpoint(action,extra=""){const q=new URLSearchParams({username:state.user,password:state.pass,action});return `${CONFIG.host}/player_api.php?${q}${extra}`}
function itemUrl(k,x){const u=encodeURIComponent(state.user),p=encodeURIComponent(state.pass);if(k==="live"||k==="sport")return `${CONFIG.host}/live/${u}/${p}/${x.stream_id}.m3u8`;if(k==="vod")return `${CONFIG.host}/movie/${u}/${p}/${x.stream_id}.${String(x.container_extension||"mp4").replace(/^\./,"")}`;return ""}
function setHero(x,k=state.kind){state.hero=x;state.heroKind=k;if(!x)return;const p=poster(k,x);$("heroTitle").textContent=x.name||"Title";$("heroDesc").textContent=k==="series"?"Open the series to choose an episode.":`Open this ${label(k).toLowerCase()} title.`;$("hero").style.setProperty("--hero",`linear-gradient(#0002,#0002),url("${String(p).replace(/["\\]/g,"")}")`);$("play").disabled=false;$("copy").disabled=false;$("download").disabled=!(k==="vod"||k==="series");$("favorite").classList.toggle("hide",k!=="series");updateFav()}
function catName(s){return String(s||"").replace(/^\|(EN|AR)\|/i,"").trim()}
function allowed(name){return /\|(EN|AR)\|/i.test(name||"")}
function sport(name){return /^(AR|BEE|UK)\|/i.test(String(name||"").trim())}
function catImage(name){const file=catName(name).replaceAll("/","-")+".png";return `${CONFIG.categoryImages.replace(/\/$/,"")}/${encodeURIComponent(file)}`}
function card(x,k=state.kind){const d=document.createElement("article");d.className="card";d.tabIndex=0;const p=poster(k,x);d.innerHTML=`<img class="poster" loading="lazy" decoding="async" src="${esc(p)}" alt=""><div class="info"><div class="name">${esc(x.name||"Title")}</div><div class="meta">${esc(label(k))}</div></div>`;d.onclick=()=>{setHero(x,k);if(k==="series")openSeries(x);else{remember(x,null,k);window.open(itemUrl(k,x),"_blank","noopener")}};d.onkeydown=e=>{if(e.key==="Enter")d.click()};return d}
function renderCategories(){const g=$("grid");g.className="grid catGrid";g.replaceChildren();if(!state.categories.length){g.innerHTML='<div class="empty">No categories found.</div>';return}const frag=document.createDocumentFragment();for(const c of state.categories){const d=document.createElement("article");d.className="cat";d.tabIndex=0;const n=catName(c.category_name);d.innerHTML=`<img loading="lazy" decoding="async" src="${esc(catImage(c.category_name))}" alt=""><div class="info"><div class="name">${esc(n)}</div><div class="meta">Open ${esc(label(state.kind))}</div></div>`;d.querySelector("img").onerror=e=>e.currentTarget.src=PH;d.onclick=()=>openCategory(c);d.onkeydown=e=>{if(e.key==="Enter")d.click()};frag.append(d)}g.append(frag)}
function renderItems(){const start=(state.page-1)*CONFIG.pageSize,visible=state.items.slice(start,start+CONFIG.pageSize),pages=Math.max(1,Math.ceil(state.items.length/CONFIG.pageSize)),g=$("grid");g.className="grid";g.replaceChildren();const frag=document.createDocumentFragment();visible.forEach(x=>frag.append(card(x)));g.append(frag);$("pager").classList.toggle("hide",pages<=1);$("pageNumber").textContent=`${state.page} / ${pages}`;$("prev").disabled=state.page<=1;$("next").disabled=state.page>=pages;$("pageSub").textContent=`${state.items.length} titles • showing ${start+1}–${Math.min(start+visible.length,state.items.length)}`}
async function loadKind(k){const token=++state.viewToken;state.kind=k;state.heroKind=k;state.category=null;state.items=[];state.page=1;document.querySelectorAll(".nav[data-kind]").forEach(b=>b.classList.toggle("active",b.dataset.kind===k));$("hero").classList.remove("hide");$("back").classList.add("hide");$("pager").classList.add("hide");$("pageTitle").textContent=`${label(k)} Categories`;$("pageSub").textContent="Loading…";$("grid").innerHTML='<div class="empty">Loading categories…</div>';const action=(k==="live"||k==="sport")?"get_live_categories":k==="vod"?"get_vod_categories":"get_series_categories";try{let data=await json(endpoint(action));if(token!==state.viewToken)return;data=Array.isArray(data)?data:[];state.categories=k==="sport"?data.filter(c=>sport(c.category_name)):(k==="vod"||k==="series")?data.filter(c=>allowed(c.category_name)):data;renderCategories();$("pageSub").textContent=`${state.categories.length} categories`;status("Ready")}catch(e){if(token!==state.viewToken)return;console.error(e);$("grid").innerHTML='<div class="empty">Could not load categories. Check the server settings.</div>';status("Load failed",true)}}
async function openCategory(c){const token=++state.viewToken,k=state.kind;state.category=c;state.page=1;$("back").classList.remove("hide");$("pageTitle").textContent=catName(c.category_name);$("pageSub").textContent="Loading…";$("grid").className="grid";$("grid").innerHTML='<div class="empty">Loading titles…</div>';const id=String(c.category_id),key=`${k}|${id}`;try{let items;if(state.cache.has(key))items=state.cache.get(key);else{const action=(k==="live"||k==="sport")?"get_live_streams":k==="vod"?"get_vod_streams":"get_series";items=await json(endpoint(action,`&category_id=${encodeURIComponent(id)}`));if(!Array.isArray(items))items=[];state.cache.set(key,items)}if(token!==state.viewToken)return;state.items=items;renderItems();if(state.items[0])setHero(state.items[0],k)}catch(e){if(token!==state.viewToken)return;console.error(e);$("grid").innerHTML='<div class="empty">Failed to load this category.</div>'}}
function showCategories(){$("back").classList.add("hide");$("pager").classList.add("hide");$("pageTitle").textContent=`${label(state.kind)} Categories`;$("pageSub").textContent=`${state.categories.length} categories`;renderCategories()}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function searchLoaded(q){q=q.trim().toLowerCase();if(q.length<2){$("results").classList.add("hide");return}const pool=[...state.cache.entries()].filter(([k])=>k.startsWith(state.kind+"|")).flatMap(([,v])=>v);const seen=new Set(),hits=[];for(const x of pool){const id=String(x.stream_id||x.series_id||x.name);if(!seen.has(id)&&String(x.name||"").toLowerCase().includes(q)){seen.add(id);hits.push(x);if(hits.length>=CONFIG.searchLimit)break}}const box=$("results");box.replaceChildren();if(!hits.length)box.innerHTML='<div class="result">No result in loaded categories. Open more categories to expand search.</div>';else hits.forEach(x=>{const d=document.createElement("div");d.className="result";d.innerHTML=`<img loading="lazy" src="${esc(poster(state.kind,x))}" alt=""><div class="resultText"><div class="name">${esc(x.name)}</div><div class="meta">${esc(label(state.kind))}</div></div>`;d.onclick=()=>{setHero(x);box.classList.add("hide")};box.append(d)});box.classList.remove("hide")}
function favs(){try{return JSON.parse(localStorage.getItem(favKey)||"{}")}catch{return{}}}function updateFav(){if(state.heroKind!=="series"||!state.hero)return;$("favorite").textContent=favs()[state.hero.series_id]?"★ Favorited":"☆ Favorite"}
function toggleFav(){if(!state.hero)return;const f=favs(),id=String(state.hero.series_id);if(f[id])delete f[id];else f[id]={...state.hero,updatedAt:Date.now()};localStorage.setItem(favKey,JSON.stringify(f));updateFav();toast(f[id]?"Added to favorites":"Removed")}
function watches(){try{return JSON.parse(localStorage.getItem(cwKey)||"[]")}catch{return[]}}function remember(x,episode=null,k=state.heroKind||state.kind){if(k!=="vod"&&k!=="series")return;const id=String(x.stream_id||x.series_id),arr=watches().filter(w=>w.id!==id);arr.unshift({id,kind:k,item:x,episode,updatedAt:Date.now()});localStorage.setItem(cwKey,JSON.stringify(arr.slice(0,24)))}
function showContinue(){++state.viewToken;state.kind="continue";document.querySelectorAll(".nav[data-kind]").forEach(b=>b.classList.toggle("active",b.dataset.kind==="continue"));$("hero").classList.add("hide");$("back").classList.add("hide");$("pager").classList.add("hide");$("pageTitle").textContent="Continue Watching";$("pageSub").textContent="Saved on this browser";const arr=watches(),g=$("grid");g.className="grid";g.replaceChildren();if(!arr.length){g.innerHTML='<div class="empty">Nothing saved yet.</div>';return}for(const w of arr)g.append(card(w.item,w.kind))}
async function seriesLinks(x){const id=String(x.series_id);if(state.seriesCache.has(id))return state.seriesCache.get(id);const data=await json(endpoint("get_series_info",`&series_id=${encodeURIComponent(id)}`)),groups=data?.episodes||{},out=[];for(const season of Object.keys(groups).sort((a,b)=>+a-+b)){for(const [i,ep] of (groups[season]||[]).entries()){const eid=ep.id||ep.episode_id||ep.stream_id;if(!eid)continue;const ext=String(ep.container_extension||"mp4").replace(/^\./,"");out.push({season,title:ep.title||ep.name||`Episode ${i+1}`,url:`${CONFIG.host}/series/${encodeURIComponent(state.user)}/${encodeURIComponent(state.pass)}/${eid}.${ext}`})}}state.seriesCache.set(id,out);return out}
async function openSeries(x){$("drawer").classList.remove("hide");$("drawerTitle").textContent=x.name||"Series";$("seasons").innerHTML='<div class="empty">Loading episodes…</div>';try{const links=await seriesLinks(x),by={};links.forEach(e=>(by[e.season]??=[]).push(e));const root=$("seasons");root.replaceChildren();for(const [s,eps] of Object.entries(by)){const det=document.createElement("details");det.className="season";det.innerHTML=`<summary>Season ${esc(s)} (${eps.length})</summary>`;for(const ep of eps){const row=document.createElement("div");row.className="episode";row.innerHTML=`<span>${esc(ep.title)}</span><button class="primary">Play</button><button class="ghost">Copy</button>`;row.children[1].onclick=()=>{remember(x,ep);window.open(ep.url,"_blank","noopener")};row.children[2].onclick=async()=>toast(await copyText(ep.url)?"Copied":"Copy failed");det.append(row)}root.append(det)}if(!links.length)root.innerHTML='<div class="empty">No episodes found.</div>'}catch(e){console.error(e);$("seasons").innerHTML='<div class="empty">Failed to load episodes.</div>'}}
function downloadUrl(url,name){const q=new URLSearchParams({url,name});return CONFIG.downloadProxy?`${CONFIG.downloadProxy}?${q}`:url}function downloadCurrent(){if(!state.hero)return;const k=state.heroKind;if(k==="series")return openSeries(state.hero);const url=itemUrl(k,state.hero),a=document.createElement("a");a.href=downloadUrl(url,safe(state.hero.name)+"."+(state.hero.container_extension||"mp4"));a.download=safe(state.hero.name);a.target="_blank";a.rel="noopener";a.click();remember(state.hero,null,k);toast("Download started")}
$("loginForm").onsubmit=async e=>{
 e.preventDefault();if(state.loginBusy)return;
 state.user=$("username").value.trim();state.pass=$("password").value.trim();
 CONFIG.host=normalizeBase($("host").value||CONFIG.host);setProxyEndpoint($("proxy").value);
 if(!state.user||!state.pass)return status("Enter both username and password.",true);
 try{new URL(CONFIG.host)}catch{return status("The server URL is not valid.",true)}
 if(location.hostname.endsWith(".github.io")&&!/^https:\/\//i.test(CONFIG.apiProxy))return status("Open Server settings and paste your full Cloudflare Worker /api URL.",true);
 if(location.protocol==="https:"&&CONFIG.host.startsWith("http://")&&!CONFIG.apiProxy)return status("This HTTPS page needs your Cloudflare Worker /api URL.",true);
 state.loginBusy=true;$("connectBtn").disabled=true;$("connectBtn").textContent="Connecting…";status("Connecting securely…");
 localStorage.setItem(settingsKey,JSON.stringify({host:CONFIG.host,proxy:CONFIG.apiProxy}));
 try{
  const loginUrl=`${CONFIG.host}/player_api.php?username=${encodeURIComponent(state.user)}&password=${encodeURIComponent(state.pass)}`;
  const data=await json(loginUrl,{dedupe:false});
  if(String(data?.user_info?.auth)!=="1")throw new Error(data?.user_info?.message||"Username or password is incorrect");
  if($("remember").checked)localStorage.setItem(authKey,JSON.stringify({user:state.user,pass:state.pass}));else localStorage.removeItem(authKey);
  document.body.classList.add("ready");status("Ready");await loadKind("vod");
 }catch(err){console.error(err);const detail=String(err?.message||"Connection failed");const proxy404=detail.includes("configured proxy: HTTP 404");status(proxy404?"Proxy not found. Paste the full Cloudflare Worker /api URL in Server settings.":detail.includes("HTTP 401")||/incorrect|invalid/i.test(detail)?"Username or password is incorrect.":`Login failed: ${detail}`,true)
 }finally{state.loginBusy=false;$("connectBtn").disabled=false;$("connectBtn").textContent="Connect"}
};
document.querySelectorAll(".nav[data-kind]").forEach(b=>b.onclick=()=>b.dataset.kind==="continue"?showContinue():loadKind(b.dataset.kind));
$("back").onclick=showCategories;$("prev").onclick=()=>{state.page--;renderItems();scrollTo({top:350,behavior:"smooth"})};$("next").onclick=()=>{state.page++;renderItems();scrollTo({top:350,behavior:"smooth"})};$("search").oninput=debounce(e=>searchLoaded(e.target.value),180);$("search").onkeydown=e=>{if(e.key==="Escape"){$("results").classList.add("hide");e.target.value=""}};document.addEventListener("click",e=>{if(!$("results").contains(e.target)&&e.target!==$("search"))$("results").classList.add("hide")});
$("play").onclick=()=>{const k=state.heroKind;if(k==="series")openSeries(state.hero);else{remember(state.hero,null,k);window.open(itemUrl(k,state.hero),"_blank","noopener")}};$("copy").onclick=async()=>{const k=state.heroKind;if(k==="series"){const links=await seriesLinks(state.hero);toast(await copyText(links.map(x=>x.url).join("\n"))?"Links copied":"Copy failed")}else toast(await copyText(itemUrl(k,state.hero))?"Copied":"Copy failed")};$("download").onclick=downloadCurrent;$("favorite").onclick=toggleFav;$("closeDrawer").onclick=()=>$("drawer").classList.add("hide");$("logout").onclick=()=>{localStorage.removeItem(authKey);location.reload()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("drawer").classList.contains("hide"))$("drawer").classList.add("hide")});
try{const s=JSON.parse(localStorage.getItem(settingsKey)||"null");if(s?.host)CONFIG.host=normalizeBase(s.host);if(typeof s?.proxy==="string")setProxyEndpoint(s.proxy)}catch{}
$("host").value=CONFIG.host;$("proxy").value=CONFIG.apiProxy;
if(location.hostname.endsWith(".github.io")&&!/^https:\/\//i.test(CONFIG.apiProxy)){document.querySelector(".advanced").open=true;status("Paste your Cloudflare Worker /api URL below, then connect.",true)}
try{const a=JSON.parse(localStorage.getItem(authKey)||"null");if(a?.user&&a?.pass){$("username").value=a.user;$("password").value=a.pass}}catch{}
</script>
