<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>TVSTAR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #0b1020;
      color: #eaf0ff;
    }

    .card {
      width: min(560px, 100%);
      padding: 22px;

      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;

      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 18px;
      color: rgba(234, 240, 255, 0.75);
      line-height: 1.4;
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 52px;
      padding: 12px 16px;

      color: #eaf0ff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;

      font-weight: 700;
      text-decoration: none;
      text-align: center;

      transition:
        transform 0.08s ease,
        background 0.15s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.7);
      outline-offset: 3px;
    }

    .primary {
      background: #6d28d9;
    }

    .primary:hover {
      background: #7c3aed;
    }

    .secondary {
      background: #2563eb;
    }

    .secondary:hover {
      background: #3b82f6;
    }

    .green {
      background: #15803d;
    }

    .green:hover {
      background: #16a34a;
    }

    @media (max-width: 520px) {
      .btns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>TVSTAR</h1>
    <p>Select the version you want to open or download.</p>

    <div class="btns">
      <!-- IPK download -->
      <a
        class="btn primary"
        href="./com.alhamza.startv_1.0.0_all.ipk"
        download
      >
        Download v1 (.ipk)
      </a>

      <!-- Android APK download -->
      <a
        class="btn primary"
        href="./app-debug5.apk"
        download
      >
        Download TV App
      </a>

      <!-- Meta Quest APK download -->
      <a
        class="btn secondary"
        href="./app-debug5.apk"
        download
      >
        Download VR Quest 3S
      </a>

      <!-- Google Apps Script webpage -->
      <a
        class="btn green"
        href="https://script.google.com/macros/s/AKfycbwq7Yj5mqyuSf6RVNOwfUCdJKpY5ARnVch9CzAb4lsz81v9AZLomLjYCxY_ramLWXXGfg/exec"
        target="_blank"
        rel="noopener noreferrer"
      >
        TV
      </a>

      <!-- LG TV webpage -->
      <a
        class="btn"
        href="./index3.html"
        target="_blank"
        rel="noopener noreferrer"
      >
        LG TV
      </a>

      <!-- LG TV View webpage -->
      <a
        class="btn"
        href="./index4.html"
        target="_blank"
        rel="noopener noreferrer"
      >
        LG TV View
      </a>
    </div>
  </main>
</body>
</html>
